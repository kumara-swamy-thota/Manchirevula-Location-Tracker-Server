spring.application.name=LocationTrackerServer
# H2 datasource (file-based) for lightweight storage
spring.datasource.url=jdbc:h2:file:./data/locationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Reset schema on startup so legacy H2 tables match the current model
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fixed server port for local run
server.port=8081

